name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyzer
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        run: |
          set -o pipefail
          if ! flutter test --reporter expanded 2>&1 | tee test_output.txt; then
            FAIL_MSG=$(grep -A 5 -E '(FAIL|ERROR|Expected:)' test_output.txt | head -n 30 | tr '\n' ' ' | sed 's/"/\\"/g')
            echo "::error title=Flutter Test Failure::$FAIL_MSG"
            exit 1
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release APK output
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "Error: Release APK not found at build/app/outputs/flutter-apk/app-release.apk"
            exit 1
          fi
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
